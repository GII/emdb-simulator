# Example custom-camera definitions, loaded via the `custom_cameras_file`
# ROS parameter (see launch/emdb_simulator.launch.py). Copy/adapt this file
# for your own scene -- use `preview_camera:=true` to check placement
# before recording a real episode.
#
# Each entry needs:
#   name   -- becomes a normal MuJoCo camera name, selectable via
#             record_video_camera / preview_camera_names just like the
#             built-in ones (agentview, robot0_agentview_center, ...).
#   pos    -- [x, y, z] position, in meters. World coordinates, UNLESS
#             parent_body is set (see below), in which case it's in that
#             body's own local frame.
#   EITHER
#     lookat -- [x, y, z] point to aim the camera at, in the same frame as
#               pos (world, or local if parent_body is set). up defaults
#               to that frame's +Z; override with an optional
#               `up: [x, y, z]`.
#   OR
#     quat   -- raw MuJoCo camera quaternion, (w, x, y, z), also in the
#               same frame as pos.
#   fovy   -- optional, vertical field of view in degrees.
#   parent_body -- optional MuJoCo body name (e.g. "mobilebase0_support").
#             Attaches the camera to that body instead of the world, so it
#             moves with the robot across layouts/episodes instead of
#             staying at a fixed world position. Skipped with a warning if
#             the named body doesn't exist on the configured robot.
#
# If both quat and lookat are given, quat wins. If a name collides with an
# existing camera (built-in or another entry), this overwrites its pose.

cameras:
  - name: top_down
    pos: [0.0, -1.0, 2.5]
    lookat: [0.0, -1.0, 0.9]
    fovy: 45

  - name: side_view
    pos: [1.8, -1.8, 1.3]
    quat: [0.653, 0.271, 0.271, 0.653]

  # A "rear view" of the robot, world-fixed (not parented to the robot base,
  # so it won't track the robot across episodes/layouts). pos/quat were
  # captured by hand-framing the shot in preview_camera and copying the
  # resulting MuJoCo camera pose (pos + xyaxes, converted to quat).
  - name: robot0_agentview_center_rear
    pos: [3.481, -3.918, 0.983]
    quat: [0.480936, 0.500199, 0.518952, 0.49919]

  # World-fixed elevated view, pos/quat captured the same way as
  # robot0_agentview_center_rear above (hand-framed in preview_camera,
  # pos + xyaxes copied from the MuJoCo camera and converted to quat).
  - name: overhead_view
    pos: [2.703, -3.681, 2.289]
    quat: [0.937321, 0.348387, -0.002613, -0.007030]

  # UNVERIFIED guess at a pulled-back "front view": mirroring pos.x off the
  # rear camera above ([-3.0, ...] instead of [3.0, ...]) actually rendered
  # as another rear-ish angle, not front -- so pos.x sign alone doesn't
  # control front/rear on this body frame. This entry instead offsets along
  # y (left/right in the base's local frame) at the same height/distance,
  # on the guess that "front" sits off to the side rather than directly
  # behind pos.x=0. preview_camera this before trusting it; if it's still
  # wrong, try pos: [0.0, -3.0, 1.8] (the opposite y sign) next.
  - name: robot0_agentview_center_front
    parent_body: mobilebase0_support
    pos: [0.0, 3.0, 1.8]
    lookat: [0.0, 0.0, 0.5]
